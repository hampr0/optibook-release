name: Build and Release Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      # 1. GitHub Secrets의 비밀번호를 안전하게 UTF-8 .env 파일로 생성
      - name: .env 파일 생성
        shell: powershell
        run: |
          Set-Content -Path .env -Value "TIDB_PASSWORD=${{ secrets.TIDB_PASSWORD }}" -Encoding utf8

      # 2. 파이썬 환경 설정
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 필수 의존성 패키지 설치
      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6 pandas openpyxl pymysql cryptography python-dotenv pyarrow

      # 4. Inno Setup 설치
      - name: Inno Setup 설치
        run: choco install innosetup -y

      # 5. Visual C++ 런타임 파일 자동 다운로드
      - name: VC++ 재배포 패키지 자동 다운로드
        run: |
          curl -L -o vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe

      # 6. PyInstaller로 EXE 바이너리 빌드
      - name: PyInstaller로 EXE 빌드
        run: |
          pyinstaller --noconfirm Optibook-IMS.spec

      # 7. Inno Setup으로 최종 설치 파일(.exe) 패키징
      - name: Inno Setup으로 설치 파일(Setup.exe) 패키징
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Optibook_AllInOne.iss

      # 8. GitHub Release에 완성된 Setup.exe 업로드
      - name: GitHub Release에 인스톨러 자동 업로드
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          files: Installer_Output/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
